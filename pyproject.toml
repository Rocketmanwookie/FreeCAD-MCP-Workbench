[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "freecad-mcp"
version = "0.1.32"
description = "Deployable FreeCAD Model Context Protocol (MCP) server & FreeCAD Addon Manager Workbench for Codex, Claude, Antigravity, and Cursor"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "Shirokuma (neka-nat)", email = "nekanat.stock@gmail.com" },
  { name = "Lierd Elliott Grant Jr.", email = "lierdg@outlook.com" },
]
keywords = ["freecad", "cad", "3d-modeling", "mcp", "model-context-protocol", "codex", "claude", "antigravity", "fem"]
dependencies = [
  "anyio>=4.14.2",
  "certifi>=2026.10.19",
  "mcp[cli]>=1.28.1,<3",
  "pydantic>=2.11,<3",
  "pyjwt>=2.15.0",
  "validators>=0.34.0",
]

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"

[project.urls]
Repository = "https://github.com/Rocketmanwookie/FreeCAD-MCP-Workbench"
Issues = "https://github.com/Rocketmanwookie/FreeCAD-MCP-Workbench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_mcp"]
